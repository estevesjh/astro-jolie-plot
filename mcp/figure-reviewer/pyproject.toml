[project]
name = "mcp-figure-reviewer"
version = "0.1.0"
description = "Physically blinded scientific figure peer-review MCP server using Anthropic Claude models with blind-vs-master truth verification and notation auditing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0,<4.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "pydantic>=2.7.0",
    "pymupdf>=1.24.0",
    "scipy>=1.17.1",
]

[project.scripts]
mcp-figure-reviewer = "mcp_figure_reviewer.server:main"
figure-review = "mcp_figure_reviewer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_figure_reviewer"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: live tests that invoke a real Anthropic backend on astrophysics figures",
]
